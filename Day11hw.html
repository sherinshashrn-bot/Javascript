<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>user system</title>
</head>
<body>
    <script>
        class User {
    constructor(name, age, email) {
        this.name = name;
        this.age = age;
        this.email = email;
    }

    
    getName() {
        return this.name;
    }

    
    getAge() {
        return this.age;
    }

    
    setEmail(newEmail) {
        if (newEmail.includes("@")) {
            this.email = newEmail;
            console.log("Email updated successfully.");
        } else {
            console.log("Invalid email format. Update failed.");
        }
    }

    
    printDetails() {
        console.log(`Name: ${this.getName()}`);
        console.log(`Age: ${this.getAge()}`);
        console.log(`Email: ${this.email}`);
    }
}


const user1 = new User("Alice", 25, "alice@example.com");


user1.setEmail("wrongformat.com");


user1.setEmail("newalice@example.com");


user1.printDetails();


    </script>
    
</body>
</html>
