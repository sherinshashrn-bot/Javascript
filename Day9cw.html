<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>comment system</title>
</head>
<body>
    <script>
        function sanitizeComment(comment) {
  
  const digitRegex = /\d/;

  
  const hasNumber = digitRegex.test(comment);

  
  const updatedComment = comment.replace(/\d+/g, "NUMBER");

  return {
    hasNumber,
    updatedComment
  };
}


const input = "My son is 12 years old. Our flat number is 45 and contact is 9876543210.";
const result = sanitizeComment(input);

console.log(result);

    </script>
    
</body>
</html>
